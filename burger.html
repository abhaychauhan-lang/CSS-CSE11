<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Burger Menu</title>
</head>
<body style="margin:0;padding:20px;background:gray;font-family:Arial">
    
    <div style="background:black;padding:40px;border-radius:8px;width:500px">

        <div style="margin-bottom:15px;display:flex;justify-content:space-between">
            <span style="color:darkgray">CHICKEN BURGER</span>
            <span style="color:darkgray">₹ 110</span>
        </div>
        
        <div style="margin-bottom:15px;display:flex;justify-content:space-between">
            <span style="color:darkgray">DOUBLE CHEESE BURGER</span>
            <span style="color:darkgray">₹ 170</span>
        </div>
        
        <div style="margin-bottom:15px;display:flex;justify-content:space-between">
            <span style="color:darkgray">CHICKEN CHEESE BURGER</span>
            <span style="color:darkgray">₹ 140</span>
        </div>

            <span style="color:darkgray">DOUBLE PATTY BURGER</span>
            <span style="color:darkgray">₹ 210</span>
        </div>

        </div>
        
        <div style="background:gold;padding:12px;text-align:center;margin-bottom:25px">

        </div>
        
        <div style="margin-bottom:15px;display:flex;justify-content:space-between">
            <span style="color:darkgray">C BURGER FRIES</span>

        </div>
        
        <div style="margin-bottom:15px;display:flex;justify-content:space-between">
            <span style="color:darkgray">CHEESE B 184</span>
            <span style="color:darkgray">₹ 209</span>
        </div>
        
        <div style="margin-bottom:15px;display:flex;justify-content:space-between">
            <span style="color:darkgray">BIG (B) CHEESE</span>
            <span style="color:darkgray">₹ 270</span>
        </div>
        
        <div style="display:flex;justify-content:space-between">

        </div>
