<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors</title>
    <link rel="stylesheet" href="./style.css">
<style>
    h1{
        color: green;
    }

</style>
</head>
<body>
    <p style="color: blue"></p>
    <h1>Hello world</h1>
    <h2>External</h2>
    <!-- class selectors can be used for many elements at once.
     selects elements with a specific class.
     Inline preference is higher than external line.
     prefrence of id is more than class and p.
     You can assign the one class to the multiple elements
     or you can assign the multiple  classes to the single elements.
     CSS properties: 
     1)color: color-name|rgb|rgba|hsl|hsla|hexadecimel
     For red-#RRGGBB will be -#FF0000
     @ rgb format--(255,0,0)
     @ rgba --(255,0,0,0.5)
     background-color:lightray;(for background color)
     @ text-align:center|left|right|justify|start|end|initial|inherit;
     Font size:
     1)em:this unit is related to font size of parent element(body).
     2)rem:this unit is related to font size of the root HTML element(HTML).
     3)%:this unit is related to font size of parent element.
     4)smaller and larger:these units adjust the font size relative to the parent element.-->
     
     <p class ="par" id="jk">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Natus rerum odio fuga accusantium officiis illo soluta. Ea libero provident excepturi, ducimus voluptatem, repellendus doloremque, praesentium illo in nesciunt eveniet assumenda!</p>
</body>
</html>
